[project]
name = "fraudmap"
version = "0.1.0"
description = "FraudMap: GNN-based financial fraud and anti-money laundering detection (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sadık Bilal Şan"},
]

dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
data = ["kaggle>=1.6.0"]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
